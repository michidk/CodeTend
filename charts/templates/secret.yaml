{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codetend.dbSecretName" . }}
  labels:
    {{- include "codetend.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "codetend.databaseUrl" . | quote }}
{{- if and .Values.migrations.enabled .Values.migrations.hook.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codetend.migrationDbSecretName" . }}
  labels:
    {{- include "codetend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  url: {{ include "codetend.databaseUrl" . | quote }}
{{- end }}
{{- end }}
