{{- if .Values.mcp.enabled }}
# Private entry for MCP. Deliberately ClusterIP-only and absent from the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codetend.fullname" . }}-mcp
  labels:
    {{- include "codetend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "codetend.selectorLabels" . | nindent 4 }}
{{- end }}
