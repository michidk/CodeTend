name: Feature request
description: Propose a new scanner, integration or workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What debt or risk goes unnoticed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How should CodeTend behave? For a new scanner, say what it owns and which existing dimension the concern currently falls into.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This does not require CodeTend to push branches, comment on GitHub or otherwise mutate the scanned repository.
