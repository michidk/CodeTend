name: Checks and Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ${{ contains(toJSON(matrix), 'linux/amd64') && 'ubicloud-standard-2' || 'ubicloud-standard-2-arm' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: tecdebt
          POSTGRES_USER: tecdebt
          POSTGRES_PASSWORD: tecdebt-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecdebt -d tecdebt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tecdebt:tecdebt-ci@127.0.0.1:5432/tecdebt
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile







      - name: Install Eve dependencies
        run: |
          npm ci --prefix eve

      - name: Check formatting, lint and import boundaries
        run: |
          bun run check

      - name: Test units
        run: |
          bun run test

      - name: Type check app and Eve agent
        run: |
          bun run typecheck
          bun run eve:typecheck


      - name: Check for dead code
        run: |
          bun run lint:deadcode

      - name: Audit production dependencies
        run: |
          bun audit --production
          # shortcut: moderate threshold waives GHSA-hp3w-g68c-fv3c (sprintf-js via
          # eve > just-bash, no patched release); restore plain `npm audit` once fixed.
          (cd eve && npm audit --omit=dev --audit-level=high)


      - name: Validate Docker Compose
        run: |
          POSTGRES_PASSWORD=ci-password EVE_PASSWORD=ci-password OPENAI_API_KEY=ci-key docker compose config --quiet

      - name: Validate Helm chart
        run: |
          helm_args=(
            --set secrets.existingSecret=codetend
            --set postgresql.existingSecret=codetend-db
            --set hodor.existingSecret=codetend-hodor
            --set hodor.image.tag=latest
          )
          docker run --rm -v "$PWD:/work:ro" -w /work alpine/helm:3.19.0 \
            lint charts "${helm_args[@]}"
          docker run --rm -v "$PWD:/work:ro" -w /work alpine/helm:3.19.0 \
            template codetend charts "${helm_args[@]}" >/dev/null


      - name: Apply database migrations
        run: |
          bun run db:migrate

      - name: Test database invariants
        run: |
          bun run test:database

      - name: Build production assets
        run: |
          bun run build

      - name: Check generated route tree
        run: |
          git diff --exit-code -- src/routeTree.gen.ts



  # Each platform builds natively; the merge job joins the per-platform digests.
  build:
    name: Build image (${{ matrix.platform }}${{ matrix.image.target && format(', {0}', matrix.image.target) || '' }})
    needs: checks
    runs-on: ${{ contains(toJSON(matrix), 'linux/amd64') && 'ubicloud-standard-2' || 'ubicloud-standard-2-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        image: [{"suffix": "", "target": "app"}, {"suffix": "-eve", "target": "eve"}]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set image name
        env:
          IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.image.target || 'default' }}
        run: |
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "DIGEST_KEY=${TARGET}-${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.DIGEST_KEY }}
          cache-to: type=gha,mode=max,scope=${{ env.DIGEST_KEY }}
      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.DIGEST_KEY }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish image${{ matrix.image.target && format(' ({0})', matrix.image.target) || '' }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ contains(toJSON(matrix), 'linux/amd64') && 'ubicloud-standard-2' || 'ubicloud-standard-2-arm' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [{"suffix": "", "target": "app"}, {"suffix": "-eve", "target": "eve"}]
    steps:
      - name: Set image name
        env:
          IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.target || 'default' }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
