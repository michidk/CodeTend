name: Checks and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # docker/metadata-action normalizes github.repository to lowercase
  # automatically, but the raw value (michidk/CodeTend) is also
  # interpolated directly into the per-platform build step's buildx
  # `outputs=` string below, which does not normalize it - so this must
  # already be lowercase, matching the ghcr.io package name.
  IMAGE_NAME: michidk/codetend

permissions:
  contents: read

concurrency:
  group: checks-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tecdebt
          POSTGRES_USER: tecdebt
          POSTGRES_PASSWORD: tecdebt-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecdebt -d tecdebt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tecdebt:tecdebt-ci@127.0.0.1:5432/tecdebt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eve/package-lock.json

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Eve dependencies
        run: npm ci
        working-directory: eve

      - name: Check formatting, lint and import boundaries
        run: bun run check

      - name: Test units
        run: bun run test

      - name: Type check app and Eve agent
        run: |
          bun run typecheck
          bun run eve:typecheck

      - name: Check for dead code
        run: bun run lint:deadcode

      - name: Audit production dependencies
        run: |
          bun audit --production
          (cd eve && npm audit --omit=dev)

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-password
          EVE_PASSWORD: ci-password
          OPENAI_API_KEY: ci-key
        run: docker compose config --quiet

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Test database invariants
        run: bun run test:database

      - name: Build production assets
        run: bun run build

      - name: Check generated route tree
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Bun's JIT reliably crashes under QEMU cross-arch emulation (SIGABRT/SIGILL;
  # see oven-sh/bun#20442, #26635), so each platform builds natively on a
  # matching-arch runner and the merge job below combines the two
  # single-platform digests into one multi-arch manifest, per Docker's
  # documented pattern for distributing builds across runners.
  build:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubicloud-standard-2' || 'ubicloud-standard-2-arm' }}
    timeout-minutes: 45
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ''
            platform: linux/amd64
          - target: app
            suffix: ''
            platform: linux/arm64
          - target: eve
            suffix: -eve
            platform: linux/amd64
          - target: eve
            suffix: -eve
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform tag
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} image (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ''
          - target: eve
            suffix: -eve
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:${{ steps.meta.outputs.version }}
