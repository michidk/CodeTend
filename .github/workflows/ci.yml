name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tecdebt
          POSTGRES_USER: tecdebt
          POSTGRES_PASSWORD: tecdebt-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecdebt -d tecdebt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tecdebt:tecdebt-ci@127.0.0.1:5432/tecdebt
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eve/package-lock.json
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: eve
      - run: bun run verify
      - run: bun audit --production
      - run: npm audit --omit=dev
        working-directory: eve
      - run: bun run db:migrate
      - run: bun run test:database
      - run: docker build --target app --tag tecdebt-app:ci .
      - run: docker build --target eve --tag tecdebt-eve:ci .
