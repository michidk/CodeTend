services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tecdebt
      POSTGRES_USER: tecdebt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecdebt -d tecdebt"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://tecdebt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/tecdebt

  eve:
    build:
      context: .
      target: eve
    restart: unless-stopped
    expose:
      - "2000"
    environment:
      PORT: "2000"
      TECDEBT_DATA_DIR: /data
      EVE_USERNAME: tecdebt
      EVE_PASSWORD: ${EVE_PASSWORD:?Set EVE_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      TECDEBT_MODEL: ${TECDEBT_MODEL:-gpt-5.6-sol}
      TECDEBT_EFFORT: ${TECDEBT_EFFORT:-}
      TECDEBT_MODEL_CONTEXT_WINDOW_TOKENS: ${TECDEBT_MODEL_CONTEXT_WINDOW_TOKENS:-}
      TECDEBT_MAX_INPUT_TOKENS_PER_SESSION: ${TECDEBT_MAX_INPUT_TOKENS_PER_SESSION:-}
      TECDEBT_SCANNER_CONCURRENCY: ${TECDEBT_SCANNER_CONCURRENCY:-4}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITNEXUS_MCP_URL: ${GITNEXUS_MCP_URL:-}
    volumes:
      - scan_data:/data
      - eve_state:/app/eve/.eve

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      eve:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://tecdebt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/tecdebt
      TECDEBT_DATA_DIR: /data
      TECDEBT_ALLOWED_GIT_HOSTS: ${TECDEBT_ALLOWED_GIT_HOSTS:-github.com}
      TECDEBT_ALLOW_LOCAL_REPOSITORIES: ${TECDEBT_ALLOW_LOCAL_REPOSITORIES:-false}
      TECDEBT_ALLOW_INSECURE_GIT: ${TECDEBT_ALLOW_INSECURE_GIT:-false}
      TECDEBT_MAX_ACTIVE_SCANS: ${TECDEBT_MAX_ACTIVE_SCANS:-2}
      TECDEBT_MAX_ACTIVE_PATCHES: ${TECDEBT_MAX_ACTIVE_PATCHES:-1}
      TECDEBT_MAX_DAILY_COST_USD: ${TECDEBT_MAX_DAILY_COST_USD:-}
      TECDEBT_DEFAULT_SCAN_COST_USD: ${TECDEBT_DEFAULT_SCAN_COST_USD:-}
      # Eve has no Docker socket/daemon in this topology by design.
      TECDEBT_VALIDATION_ENABLED: ${TECDEBT_VALIDATION_ENABLED:-false}
      TECDEBT_VALIDATION_RUNNER: ${TECDEBT_VALIDATION_RUNNER:-auto}
      TECDEBT_VALIDATION_IMAGE: ${TECDEBT_VALIDATION_IMAGE:-node:26-bookworm-slim}
      TECDEBT_MANUAL_SCAN_COOLDOWN_SECONDS: ${TECDEBT_MANUAL_SCAN_COOLDOWN_SECONDS:-60}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EVE_URL: http://eve:2000
      EVE_USERNAME: tecdebt
      EVE_PASSWORD: ${EVE_PASSWORD:?Set EVE_PASSWORD in .env}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
      # GitNexus runs in the app image and is reached by Eve over the shared network.
      GITNEXUS_ENABLED: ${GITNEXUS_ENABLED:-false}
      # MCP OAuth derives its signing key from the same secret as the Hodor
      # proxy. Leave empty when MCP is not used in this development topology.
      HODOR_SECRET: ${HODOR_SECRET:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    volumes:
      - scan_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/api/health');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  scan_data:
  eve_state:
